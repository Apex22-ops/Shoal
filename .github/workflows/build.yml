name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            dist: npm run dist:mac
          - os: windows-latest
            dist: npm run dist:win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - name: Syntax checks
        shell: bash
        run: npm run check
      - name: Smoke test (server + real terminal)
        run: node scripts/smoke.mjs
      - name: Build the app
        shell: bash
        run: ${{ matrix.dist }}
      - uses: actions/upload-artifact@v4
        with:
          name: shoal-${{ matrix.os }}
          path: dist/*.zip
      - name: Attach to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          overwrite_files: true
